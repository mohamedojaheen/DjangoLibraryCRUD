{% extends "library/base.html" %}
{% block content %}
<h2 class="mb-4">All Books</h2>
{% if books %}
    <div class="row">
        {% for book in books %}
            <div class="col-md-4">
                <div class="card mb-3 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">
                            <a href="{% url 'book_detail' book.pk %}">{{ book.title }}</a>
                        </h5>
                        <p class="card-text">
                            <strong>Author:</strong> {{ book.author.name }}<br>
                            <strong>Price:</strong> ${{ book.price }}
                        </p>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
{% else %}
    <div class="alert alert-info">No books available.</div>
{% endif %}
{% endblock %}
